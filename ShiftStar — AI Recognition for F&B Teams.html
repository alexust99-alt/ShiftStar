<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShiftStar — AI Recognition for F&B Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   ShiftStar — AI staff recognition for F&B teams
   Dark luxury · champagne gold
   ============================================================ */

:root {
  /* brand green */
  --primary:#58CC02; --primary-deep:#46A302; --primary-tint:#E9F9D9; --primary-tint2:#CFF0B0;
  --primary-glow:rgba(88,204,2,0.22);

  /* gold stars (metal-text + star emphasis) */
  --gold:#FFC800; --gold-bright:#FFB000; --gold-deep:#E0A400; --gold-glow:rgba(255,200,0,0.26);
  --metal: linear-gradient(135deg,#FFD84A 0%,#FFC000 48%,#F29500 100%);
  --metal-ring: conic-gradient(from 210deg,#E0A400,#FFE08A,#FFC800,#FFD84A,#E0A400,#FFE08A,#E0A400);

  /* colorful accent set (badges + avatars) */
  --c-green:#58CC02; --c-blue:#1CB0F6; --c-purple:#CE82FF; --c-orange:#FF9600;
  --c-gold:#FFC800; --c-teal:#12C2AC; --c-pink:#FF5A8F; --c-red:#FF4B4B;
  --c-cyan:#19C3E6; --c-magenta:#E255A0;

  /* clean light neutrals */
  --bg:#FFFFFF; --bg-2:#F5F7F0;
  --surface:#FFFFFF; --surface-2:#F7F8F3; --surface-3:#EDF1E5;
  --line:#E8E8E1; --line-2:#D8D8CE;

  --ink:#3C3C3C; --ink-soft:#5C5C55; --ink-faint:#9A9A8E; --ink-dim:#C0C0B5;

  --radius:18px; --radius-sm:12px; --radius-lg:24px;
  --serif:'Nunito', system-ui, -apple-system, sans-serif;
  --sans:'Nunito', system-ui, -apple-system, sans-serif;

  --shadow:0 16px 40px rgba(60,64,40,0.13);
  --glow:0 0 0 1px var(--line);
}

/* accent variants (Tweak: Accent) */
[data-metal="blue"]   { --primary:#1CB0F6; --primary-deep:#1899D6; --primary-tint:#E1F4FE; --primary-tint2:#BFE8FD; --primary-glow:rgba(28,176,246,0.22); }
[data-metal="purple"] { --primary:#CE82FF; --primary-deep:#A95FE0; --primary-tint:#F4E9FF; --primary-tint2:#E6CFFF; --primary-glow:rgba(206,130,255,0.22); }
[data-metal="orange"] { --primary:#FF9600; --primary-deep:#E07E00; --primary-tint:#FFEFD6; --primary-tint2:#FFDCA6; --primary-glow:rgba(255,150,0,0.22); }

[data-bg="onyx"] { --bg:#F4F6EE; --bg-2:#ECEFE3; --surface:#FFFFFF; --surface-2:#F2F5EB; }

* { box-sizing: border-box; }
html, body { margin:0; height:100%; }
body {
  font-family: var(--sans);
  background:
    radial-gradient(1100px 620px at 86% -12%, var(--primary-tint), transparent 52%),
    radial-gradient(900px 520px at -6% 112%, #FFF4D2, transparent 52%),
    var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#root { height: 100vh; }
button { font-family: inherit; cursor: pointer; color: inherit; }
::selection { background: var(--primary-tint2); }

/* scrollbars */
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--ink-dim); border:3px solid transparent; background-clip: content-box; }

.serif { font-family: var(--serif); }
.metal-text {
  background: var(--metal); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: var(--ink-faint); }
.muted { color: var(--ink-faint); }

/* ============================================================
   App shell
   ============================================================ */
.app { display:flex; flex-direction:column; height:100vh; }

.topbar {
  display:flex; align-items:center; gap:20px;
  padding: 0 30px; height: 74px; flex:none;
  border-bottom: 2px solid var(--line);
  background: var(--surface);
}
.wordmark { display:flex; align-items:center; gap:12px; }
.wordmark .name { font-family:var(--serif); font-weight:800; font-size:24px; letter-spacing:-0.4px; }
.wordmark .name b { font-weight:900; }
.topbar .venue {
  margin-left:6px; padding-left:18px; border-left:1px solid var(--line);
  display:flex; flex-direction:column; line-height:1.2;
}
.topbar .venue b { font-size:13.5px; font-weight:700; letter-spacing:0.2px; }
.topbar .venue span { font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:0.16em; text-transform:uppercase; }
.topbar .spacer { flex:1; }

/* perspective switch */
.switch {
  display:flex; align-items:center; gap:2px; padding:4px;
  background: var(--surface); border:1px solid var(--line); border-radius:99px;
  position:relative;
}
.switch .opt {
  padding: 8px 18px; border-radius:99px; border:none; background:transparent;
  font-weight:700; font-size:13px; color:var(--ink-faint); letter-spacing:0.02em;
  display:flex; align-items:center; gap:8px; transition: color .2s; z-index:1;
}
.switch .opt.on { color: #fff; }
.switch .thumb {
  position:absolute; top:4px; bottom:4px; border-radius:99px;
  background: var(--primary); box-shadow: 0 2px 8px var(--primary-glow), inset 0 -2px 0 rgba(0,0,0,0.12);
  transition: left .26s cubic-bezier(.5,1.4,.5,1), width .26s;
}

.scroll { flex:1; overflow-y:auto; overflow-x:hidden; }
.page { max-width: 1280px; margin: 0 auto; padding: 34px 34px 64px; }

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  border:none; border-radius:14px; font-weight:800; font-size:14px;
  padding: 13px 22px; letter-spacing:0.01em; display:inline-flex; align-items:center; gap:9px;
  background: var(--primary); color:#fff;
  box-shadow: 0 4px 0 var(--primary-deep);
  transition: transform .08s, filter .15s, box-shadow .08s;
}
.btn:hover { filter:brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-deep); }
.btn:disabled { opacity:0.45; cursor:not-allowed; filter:none; transform:none; }
.btn.ghost {
  background: var(--surface); color: var(--ink-soft);
  border:2px solid var(--line); box-shadow:0 4px 0 var(--line);
}
.btn.ghost:hover { color: var(--ink); }
.btn.ghost:active { transform: translateY(4px); box-shadow:0 0 0 var(--line); }
.btn.gold-outline {
  background: var(--primary-tint); color: var(--primary-deep);
  box-shadow:0 4px 0 var(--primary-tint2);
}
.btn.gold-outline:active { transform: translateY(4px); box-shadow:0 0 0 var(--primary-tint2); }
.btn.sm { padding: 9px 15px; font-size:12.5px; border-radius:11px; box-shadow:0 3px 0 var(--primary-deep); }
.btn.sm:active { transform: translateY(3px); box-shadow:0 0 0 var(--primary-deep); }
.btn.ghost.sm { box-shadow:0 3px 0 var(--line); }
.btn.ghost.sm:active { box-shadow:0 0 0 var(--line); }
.btn.gold-outline.sm { box-shadow:0 3px 0 var(--primary-tint2); }
.btn.gold-outline.sm:active { box-shadow:0 0 0 var(--primary-tint2); }
.btn.block { width:100%; justify-content:center; }

.chip {
  border:2px solid var(--line); background:var(--surface);
  border-radius:99px; padding:8px 15px; font-weight:700; font-size:13px;
  color:var(--ink-soft); display:inline-flex; align-items:center; gap:8px;
  transition: border-color .15s, background .15s, color .15s;
}
.chip:hover { border-color: var(--line-2); color:var(--ink); }
.chip.sel { border-color: var(--primary); background: var(--primary-tint); color: var(--primary-deep); }
.chip.sel .dot { background: var(--primary); }

/* ============================================================
   Cards
   ============================================================ */
.card {
  background: var(--surface);
  border:2px solid var(--line); border-radius: var(--radius);
  padding: 24px;
}
.card.lux {
  background: var(--surface);
  border-color: var(--line);
  box-shadow: 0 2px 0 var(--line), 0 14px 30px rgba(60,64,40,0.07);
}
.card-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.card-head h3 { font-family:var(--serif); font-weight:800; font-size:22px; margin:0; line-height:1.15; }
.card-head > div { flex:1; min-width:0; }
.card-head .sub { font-size:12.5px; color:var(--ink-faint); font-weight:600; margin-top:2px; }
.hairline { height:1px; background: var(--line); margin: 18px 0; border:none; }

/* avatar */
.av {
  border-radius:50%; display:grid; place-items:center; flex:none;
  font-weight:800; color:#fff; font-family:var(--sans);
  background: var(--av-color, var(--primary)); position:relative;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,0.13);
}
.av.plain { background: var(--surface-3); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line-2); }
.av.ring { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold), inset 0 -3px 0 rgba(0,0,0,0.13); }
.av.s28 { width:28px; height:28px; font-size:11px; }
.av.s36 { width:36px; height:36px; font-size:13px; }
.av.s44 { width:44px; height:44px; font-size:15px; }
.av.s64 { width:64px; height:64px; font-size:22px; }
.av.s84 { width:84px; height:84px; font-size:30px; }

/* ============================================================
   Medallion badge
   ============================================================ */
.medallion { position:relative; flex:none; display:grid; place-items:center; }
.medallion .ring {
  position:absolute; inset:0; border-radius:50%;
  background: var(--bcd, var(--gold-deep));
  box-shadow: 0 3px 7px rgba(60,64,40,0.18);
}
.medallion .disc {
  position:absolute; inset:4px; border-radius:50%;
  background: linear-gradient(165deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 46%), var(--bc, var(--gold));
  box-shadow: inset 0 2px 2px rgba(255,255,255,0.55), inset 0 -6px 12px rgba(0,0,0,0.15);
  display:grid; place-items:center;
}
.medallion .glyph { color:#fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.18)); }
.medallion.locked .ring { background:#D2D2C7; box-shadow:none; }
.medallion.locked .disc { background: linear-gradient(165deg, #fff, #ECECE4); box-shadow: inset 0 -4px 9px rgba(0,0,0,0.05); }
.medallion.locked .glyph { color:#C4C4B8; filter:none; }
.medallion .lock {
  position:absolute; inset:auto; right:0; bottom:0; width:42%; height:42%;
  background:var(--surface);
  border:1px solid var(--line-2); border-radius:50%; box-shadow:0 2px 6px rgba(60,64,40,0.22);
  display:grid; place-items:center; color:var(--ink-faint);
}
.medallion .lock svg { width:48%; height:48%; }
.medallion.m48 { width:48px; height:48px; }
.medallion.m64 { width:64px; height:64px; }
.medallion.m92 { width:92px; height:92px; }
.medallion.m120 { width:120px; height:120px; }

/* ============================================================
   Manager view
   ============================================================ */
.greet { display:flex; align-items:flex-end; gap:20px; margin-bottom:26px; }
.greet > div:first-child { flex:1; min-width:0; }
.greet h1 { font-family:var(--serif); font-weight:900; font-size:38px; margin:0; letter-spacing:-0.5px; line-height:1.12; white-space:nowrap; }
.greet .when { font-size:13px; color:var(--ink-faint); font-weight:600; margin-top:4px; letter-spacing:0.04em; }
.greet .spacer { flex:1; }

.statline { display:flex; gap:14px; }
.statpill {
  background: var(--surface); border:2px solid var(--line); border-radius:16px;
  padding:12px 18px; min-width:96px; text-align:left;
}
.statpill .v { font-family:var(--serif); font-weight:900; font-size:28px; line-height:1; }
.statpill .l { font-size:10.5px; color:var(--ink-faint); font-weight:700; letter-spacing:0.14em; text-transform:uppercase; margin-top:6px; }

.mgr-grid { display:grid; grid-template-columns: 1.55fr 1fr; gap:22px; align-items:start; }

/* composer */
.step-lab { display:flex; align-items:center; gap:10px; margin: 4px 0 13px; }
.step-num {
  width:22px; height:22px; border-radius:50%; flex:none;
  background: var(--primary-tint); border:none;
  display:grid; place-items:center; font-size:11px; font-weight:900; color:var(--primary-deep);
}
.step-lab .t { font-size:12.5px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-soft); }
.who-row { display:flex; flex-wrap:wrap; gap:8px; }
.who {
  display:flex; align-items:center; gap:9px; padding:6px 13px 6px 6px;
  border:2px solid var(--line); background:var(--surface); border-radius:99px;
  font-weight:700; font-size:13px; color:var(--ink-soft); transition: all .15s;
}
.who:hover { border-color: var(--line-2); }
.who.sel { border-color: var(--primary); background: var(--primary-tint); color:var(--primary-deep); }
.moments { display:flex; flex-wrap:wrap; gap:8px; }

textarea.lux-area, input.lux-input {
  width:100%; background: var(--surface-2); border:2px solid var(--line); border-radius:12px;
  color: var(--ink); font-family:var(--sans); font-size:14px; font-weight:600; padding:12px 15px;
  resize:vertical; outline:none; transition: border-color .15s;
}
textarea.lux-area:focus, input.lux-input:focus { border-color: var(--primary); }

}

.star-toggle.on { background: var(--gold); color:#fff; border-color:transparent; box-shadow:0 2px 0 var(--gold-deep); }

.nudge {

}
.nudge .meta { line-height:1.25; min-width:0; }
.nudge .meta b { font-size:13px; font-weight:700; }
.nudge .meta span { font-size:11px; color:var(--ink-faint); font-weight:600; }

    var(--surface);

}

}

/* sparkle pulse */
@keyframes twinkle { 0%,100%{ transform:scale(1); opacity:.9 } 50%{ transform:scale(1.18); opacity:1 } }
.twinkle { animation: twinkle 2.4s ease-in-out infinite; }
.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-6px) } }

.toast {
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%);

  box-shadow: var(--shadow); animation: rise .25s cubic-bezier(.4,1.3,.5,1);
  font-weight:800; font-size:14px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ---- 5-point star logo mark ---- */
function StarMark({ size = 30, glow = true }) {
  const id = React.useId();
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" style={glow ? { filter: "drop-shadow(0 2px 8px var(--gold-glow))" } : null}>
      <defs>
        <linearGradient id={"m" + id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#F6E6B6" /><stop offset="45%" stopColor="var(--gold)" /><stop offset="100%" stopColor="var(--gold-deep)" />
        </linearGradient>
      </defs>
      <path d="M20 2.5l4.9 10.3 11.3 1.5-8.3 7.8 2.1 11.2L20 29.4 9.9 34.8l2.1-11.2-8.3-7.8 11.3-1.5L20 2.5z"
            fill={"url(#m" + id + ")"} stroke="rgba(255,255,255,0.25)" strokeWidth="0.6" />
    </svg>
  );
}

function Avatar({ p, size = "s36", ring = false }) {
  return <div className={"av " + size + (ring ? " ring" : "")}
              style={p.avc ? { "--av-color": p.avc } : null}>{p.av || p.name?.[0]}</div>;
}

/* ---- Medallion badge ---- */
function Medallion({ badge, size = "m64", locked = false, glyphSize }) {
  const gs = glyphSize || ({ m48:20, m64:26, m92:38, m120:50 }[size] || 26);
  return (
    <div className={"medallion " + size + (locked ? " locked" : "")}
         style={{ "--bc": badge.color, "--bcd": badge.deep }}>
      <div className="ring" />
      <div className="disc">
        <span className="glyph"><Icon g={GLYPHS[badge.glyph] || GLYPHS.star} size={gs} sw={1.5} /></span>
      </div>
      {locked && <div className="lock"><Icon g={GLYPHS.lock} size={Math.round(gs * 0.7)} sw={1.8} /></div>}
    </div>
  );
}

const { BADGES: MB, TEAM: MTEAM, MOMENTS, TONES, SHIFTLOG, fallbackMessage } = window.SS;

function ManagerView({ onSend }) {
  const team = MTEAM;
  const [who, setWho] = React.useState('maya');
  const [moment, setMoment] = React.useState('guest');
  const [custom, setCustom] = React.useState('');
  const [tone, setTone] = React.useState('Warm');
  const [loading, setLoading] = React.useState(false);
  const [result, setResult] = React.useState(null);   // {msg, badgeId}
  const [editing, setEditing] = React.useState(false);
  const [log, setLog] = React.useState(SHIFTLOG);

  const emp = team.find(e => e.id === who);
  const momentObj = MOMENTS.find(m => m.id === moment);
  const badgeId = momentObj ? momentObj.badge : 'fivestar';

  // ---- AI generation ----
  async function generate() {
    setLoading(true); setResult(null); setEditing(false);
    const momentText = custom.trim() || momentObj.label;
    const prompt = `You are writing a short staff-recognition note for a fine-dining restaurant called Aurelia.
Team member: ${emp.name}, role: ${emp.role}.
What they did: ${momentText}.
Tone: ${tone}.
Write 2 to 3 sentences, addressed directly to ${emp.name.split(' ')[0]} by first name. Be specific, genuine and human — no clichés, no corporate filler, no hashtags. ${tone === 'Playful' ? 'A little warmth and a touch of fun is welcome.' : ''}
Return ONLY the message text, nothing else.`;
    try {
      if (window.claude && window.claude.complete) {
        let txt = await window.claude.complete(prompt);
        txt = (txt || '').trim().replace(/^["']|["']$/g, '');
        if (!txt) throw new Error('empty');
        setResult({ msg: txt, badgeId });
      } else {
        await new Promise(r => setTimeout(r, 900));
        setResult({ msg: fallbackMessage(emp.name.split(' ')[0], momentText, tone), badgeId });
      }
    } catch (e) {
      setResult({ msg: fallbackMessage(emp.name.split(' ')[0], momentText, tone), badgeId });
    } finally {
      setLoading(false);
    }
  }

  function send() {
    onSend({ emp, badgeId: result.badgeId, msg: result.msg });
    setResult(null); setCustom('');
  }

  const toggleStandout = id => setLog(l => l.map(s => s.id === id ? { ...s, standout: !s.standout } : s));
  const standouts = log.filter(s => s.standout).length;

  // AI nudge — who hasn't been recognized recently (lowest stars)
  const nudges = [...team].sort((a, b) => a.stars - b.stars).slice(0, 3);

            </span>
            <div>

              <div className="sub">Pick a moment — AI drafts the words.</div>
            </div>
          </div>

          {/* step 1 — who */}

          <div className="who-row">
            {team.map(e => (
              <button key={e.id} className={"who" + (who === e.id ? " sel" : "")} onClick={() => setWho(e.id)}>
                <Avatar p={e} size="s28" ring={who === e.id} />
                {e.name.split(' ')[0]}
              </button>
            ))}
          </div>

          {/* step 2 — moment */}
          <div className="step-lab" style={{ marginTop:22 }}><span className="step-num">2</span><span className="t">For what</span></div>
          <div className="moments">
            {MOMENTS.map(m => (
              <button key={m.id} className={"chip" + (moment === m.id && !custom ? " sel" : "")}
                onClick={() => { setMoment(m.id); setCustom(''); }}>
                <Medallion badge={MB[m.badge]} size="m48" glyphSize={13} style={{ width:18 }} />
                {m.label}
              </button>
            ))}
          </div>
          <input className="lux-input" style={{ marginTop:10 }} placeholder="…or describe the moment in your own words"
            value={custom} onChange={e => setCustom(e.target.value)} />

          {/* step 3 — tone */}
          <div className="step-lab" style={{ marginTop:22 }}><span className="step-num">3</span><span className="t">Tone</span></div>
          <div className="tone-row">
            {TONES.map(tn => (

            ))}
            <div style={{ flex:1 }} />
            <button className="btn" onClick={generate} disabled={loading}>
              <Icon g={GLYPHS.sparkles} size={17} sw={1.6} />
              {loading ? 'Composing…' : result ? 'Regenerate' : 'Generate with AI'}
            </button>
          </div>

          {/* result */}
          {(loading || result) && (
            <div className="result" style={{ marginTop:20 }}>
              {loading ? (
                <div className="gen-loading">
                  <div className="ln shimmer" style={{ width:'92%' }} />
                  <div className="ln shimmer" style={{ width:'100%' }} />

              ) : (
                <>

          {/* shift log */}
          <div className="card">
            <div className="card-head" style={{ marginBottom:6 }}>
              <div style={{ flex:1 }}>
                <h3 style={{ fontSize:20 }}>Tonight's floor</h3>

              </div>
              <button className="btn ghost sm"><Icon g={GLYPHS.plus} size={15} />Log shift</button>
            </div>
            <div>
              {log.map(s => {
                const e = team.find(x => x.id === s.emp);

                    <div className="meta">
                      <b>{e.name}</b><br/>
                      <span>{e.role}</span>
                    </div>
                    <span className="period">{s.period}</span>
                    <button className={"star-toggle" + (s.standout ? " on" : "")} onClick={() => toggleStandout(s.id)}

                      <Icon g={GLYPHS.star} size={15} sw={1.4} />

          {/* AI nudges */}

            <div className="card-head" style={{ marginBottom:14 }}>

/* ---- confetti ---- */
function Confetti({ n = 70 }) {
  const cols = ['#58CC02', '#1CB0F6', '#FFC800', '#CE82FF', '#FF5A8F', '#FF9600', '#12C2AC'];
  const pcs = React.useMemo(() => Array.from({ length: n }, (_, i) => ({
    left: Math.random() * 100, delay: Math.random() * 0.5, dur: 1.9 + Math.random() * 1.5,
    col: cols[i % cols.length], rot: Math.random() * 360, w: 6 + Math.random() * 6, round: Math.random() > 0.5,
  })), []);
  return <>{pcs.map((p, i) => (
    <div key={i} className="confetti-pc" style={{ left: p.left + 'vw', background: p.col,
      animationDuration: p.dur + 's', animationDelay: p.delay + 's', width: p.w, height: p.w * 1.5,
      borderRadius: p.round ? '50%' : 1, transform: `rotate(${p.rot}deg)` }} />
  ))}</>;
}

        <div className="modal-actions">
          <button className="btn block" onClick={onClose}>Beautiful</button>
        </div>
      </div>
    </div>
  );
}

/* ---- badge detail ---- */
function BadgeModal({ data, onClose }) {
  const { badge, earned } = data;
  return (
    <div className="scrim" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" onMouseDown={e => e.stopPropagation()} style={{ position:'relative', width:400 }}>
        <button className="iconbtn" onClick={onClose}>✕</button>
        <div style={{ display:'grid', placeItems:'center', marginTop:8 }}>
          <Medallion badge={badge} size="m120" locked={!earned} />
        </div>
        <div className="eyebrow" style={{ marginTop:18, color: earned ? 'var(--gold-bright)' : 'var(--ink-faint)' }}>
          {earned ? 'Earned' : 'Locked'}
        </div>
        <h2>{badge.title}</h2>
        <div className="m-sub" style={{ fontSize:15, marginTop:6 }}>{badge.desc}</div>
        {!earned && <div className="m-sub" style={{ marginTop:14, color:'var(--ink-dim)' }}>Keep it up — this one's within reach.</div>}
        <div className="modal-actions">
          <button className="btn block" onClick={onClose}>{earned ? 'Wear it proudly' : 'Got it'}</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = React.useState('manager');
  const [sent, setSent] = React.useState(null);
  const [badgeModal, setBadgeModal] = React.useState(null);
  const [extraHistory, setExtraHistory] = React.useState([]);

  React.useEffect(() => {
    const r = document.documentElement;
    if (t.accent === 'green') r.removeAttribute('data-metal');
    else r.setAttribute('data-metal', t.accent);
    r.setAttribute('data-bg', t.backdrop === 'soft' ? 'onyx' : 'white');
    r.style.setProperty('--radius',    t.rounded ? '18px' : '9px');
    r.style.setProperty('--radius-sm', t.rounded ? '12px' : '7px');
    r.style.setProperty('--radius-lg', t.rounded ? '24px' : '12px');
  }, [t.accent, t.backdrop, t.rounded]);

  function handleSend({ emp, badgeId, msg }) {
    const stars = 60 + Math.round(Math.random() * 60);
    if (emp.me) {
      setExtraHistory(h => [{ id: nid('h'), from:'Robin Vale', role:'Manager', badge: badgeId,
        stars, when:'Just now', msg }, ...h]);
    }
    if (t.celebrate) setSent({ emp, badgeId, msg, stars });
  }

  const isMgr = view === 'manager';

  return (
    <div className="app">
      <div className="topbar">
        <div className="wordmark">
          <StarMark size={32} />
          <div className="name">Shift<b className="metal-text">Star</b></div>
        </div>
        <div className="venue">
          <b>Aurelia</b>
          <span>Fine Dining</span>
        </div>
        <div className="spacer" />
        <div className="switch">
          <div className="thumb" style={{ left: isMgr ? 4 : '50%', width: 'calc(50% - 4px)' }} />
          <button className={"opt" + (isMgr ? " on" : "")} onClick={() => setView('manager')}>
            <Icon g={GLYPHS.manager} size={17} sw={1.7} />Manager
          </button>
          <button className={"opt" + (!isMgr ? " on" : "")} onClick={() => setView('employee')}>
            <Icon g={GLYPHS.employee} size={17} sw={1.7} />Employee
          </button>
        </div>
      </div>

      <div className="scroll">
        {isMgr
          ? <ManagerView onSend={handleSend} />
          : <EmployeeView extraHistory={extraHistory} onBadgeClick={setBadgeModal} />}
      </div>

      {sent && <SentModal data={sent} onClose={() => setSent(null)} />}
      {badgeModal && <BadgeModal data={badgeModal} onClose={() => setBadgeModal(null)} />}

      <TweaksPanel>
        <TweakSection label="Color" />
        <TweakRadio label="Accent" value={t.accent} options={["green","blue","purple","orange"]}
          onChange={v => setTweak('accent', v)} />
        <TweakRadio label="Backdrop" value={t.backdrop} options={["white","soft"]}
          onChange={v => setTweak('backdrop', v)} />
        <TweakSection label="Style" />
        <TweakToggle label="Rounded corners" value={t.rounded}
          onChange={v => setTweak('rounded', v)} />
        <TweakSection label="Delight" />
        <TweakToggle label="Confetti on send" value={t.celebrate}
          onChange={v => setTweak('celebrate', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
<script>
(async () => {
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  @page { margin: 0.5cm; }\n  html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }\n  section, article, figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
  if (document.readyState === 'loading') {
    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  }
  let ds = document.querySelector('deck-stage');
  // whenDefined never resolves when nothing registers the element, so only
  // await it when a <deck-stage> tag exists (and race a timeout regardless).
  if (ds && !customElements.get('deck-stage')) {
    try {
      await Promise.race([
        customElements.whenDefined('deck-stage'),
        new Promise((r) => setTimeout(r, 3000)),
      ]);
    } catch (e) {}
    ds = document.querySelector('deck-stage');
  }
  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on
  // DOMContentLoaded; settle on that subtree so React has rendered before
  // print(). Non-DC pages fall through to weighing body.
  const isDc = !ds && 'DCLogic' in window;
  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;
  if (settleRoot) {
    // Weigh only content children — skip script/style/template so inline
    // Babel/CSS doesn't register as stable "content" before the framework
    // has mounted anything.
    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';
    const weigh = () => {
      let text = 0, media = 0;
      for (const c of settleRoot.children) {
        const t = c.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        text += (c.textContent || '').trim().length;
        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);
      }
      return text + media * 100;
    };
    // "Non-zero and stable" alone is not sufficient to mean rendered: generic
    // body can carry a static shell while async main content is pending, and
    // #dc-root can carry the root DC's static text while child refs are still
    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never
    // accept stability while a dc-runtime placeholder is present.
    const isGeneric = settleRoot === document.body;
    const deadline = Date.now() + 15000;
    let last = -1, stable = 0;
    while (Date.now() < deadline) {
      const n = weigh();
      const ready =
        (!isGeneric || document.readyState === 'complete') &&
        !settleRoot.querySelector('.sc-placeholder');
      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }
      last = n;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  try { await document.fonts.ready; } catch (e) {}
  // Jump every animation to its end state so print() never captures a slide
  // mid-entrance. Ordering matters: the 0s-transition style must be live
  // BEFORE data-deck-active is set so attribute-keyed transitions don't
  // start a (now-0s) run from the pre-active base.
  const st = document.createElement('style');
  st.textContent = '*,*::before,*::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}';
  document.head.appendChild(st);
  for (const d of document.querySelectorAll('deck-stage')) {
    for (const c of d.children) {
      const t = c.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
      c.setAttribute('data-deck-active', '');
    }
  }
  try {
    const sweep = () => {
      for (const a of document.getAnimations()) {
        try { a.finish(); } catch (e) {
          try { a.currentTime = (a.effect && a.effect.getComputedTiming().duration) || 0; a.pause(); } catch (e2) {}
        }
      }
    };
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
  } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);
})();
</script>
